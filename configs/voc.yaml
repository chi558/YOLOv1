dataset:
  format: voc_xml
  root: /path/to/VOCdevkit
  image_sets:
    train:
      - [VOC2007, trainval]
      - [VOC2012, trainval]
    val:
      - [VOC2007, test]
  image_size: 448
  num_workers: 8

model:
  grid_size: 7
  num_boxes: 2
  num_classes: 20
  backbone: resnet18
  pretrained_backbone: true

train:
  epochs: 150
  batch_size: 32
  learning_rate: 0.001
  lr_decay:
    - 90
    - 120
  momentum: 0.9
  weight_decay: 0.0005
  label_smoothing: 0.1
  lambda_coord: 5.0
  lambda_noobj: 0.5
  checkpoint_dir: checkpoints
  checkpoint_interval: 10
  eval_interval: 10
  eval_conf_threshold: 0.05
  run_dir: runs
  seed: 2023

classes:
  - aeroplane
  - bicycle
  - bird
  - boat
  - bottle
  - bus
  - car
  - cat
  - chair
  - cow
  - diningtable
  - dog
  - horse
  - motorbike
  - person
  - pottedplant
  - sheep
  - sofa
  - train
  - tvmonitor
