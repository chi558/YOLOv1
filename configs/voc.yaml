dataset:
  # Supported formats:
  # - voc_xml: <root>/VOC2007 and <root>/VOC2012 with JPEGImages/Annotations/ImageSets/Main
  # - yolo_labels: <root>/images/<split> and <root>/labels/<split> created by scripts/prepare_pascal_voc.py
  format: voc_xml
  root: <path-to-VOCdevkit-or-prepared-PASCAL-VOC>
  image_sets:
    train:
      - [VOC2007, trainval]
      - [VOC2012, trainval]
    val:
      - [VOC2007, test]
  splits:
    train:
      - train2007
      - val2007
      - train2012
      - val2012
    val:
      - test2007
  image_size: 448
  num_workers: 4

model:
  grid_size: 7
  num_boxes: 2
  num_classes: 20
  pretrained_backbone: true

train:
  epochs: 135
  batch_size: 16
  learning_rate: 0.0005
  momentum: 0.9
  weight_decay: 0.0005
  lambda_coord: 5.0
  lambda_noobj: 0.5
  checkpoint_dir: checkpoints
  run_dir: runs
  seed: 42

classes:
  - aeroplane
  - bicycle
  - bird
  - boat
  - bottle
  - bus
  - car
  - cat
  - chair
  - cow
  - diningtable
  - dog
  - horse
  - motorbike
  - person
  - pottedplant
  - sheep
  - sofa
  - train
  - tvmonitor
